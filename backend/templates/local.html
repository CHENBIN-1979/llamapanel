<div class="card">
    <h1>💾 本地模型</h1>
    <p class="subtitle">管理已下载的 GGUF 模型</p>
    
    <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <button class="btn-primary" onclick="refreshLocalModels()">🔄 刷新列表</button>
        <button class="btn-primary" onclick="createSymlinksForSelected()">🔗 为选中创建软链接</button>
        <button class="btn-primary" onclick="createSymlinks()">🔗 全部创建软链接</button>
        <span id="selectedCount" style="font-size: 13px; color: #667eea; display: none;">已选 0 个</span>
    </div>
    
    <div id="localModelsList">
        <div class="loading"></div> 加载中...
    </div>
</div>

<div class="card">
    <h3>📁 模型存储路径</h3>
    <div class="info-text">
        <strong>模型目录:</strong> <code>/data/llamapanel/models/</code><br>
        <strong>软链接目录:</strong> <code>/data/llamapanel/model_links/</code> (独立目录，不受 llama.cpp 更新影响)
    </div>
</div>

<div class="card">
    <h3>🔗 软链接文件列表</h3>
    <div id="symlinksList">
        <div class="loading"></div> 加载中...
    </div>
</div>

<style>
    .btn-primary {
        background: #667eea;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
    }
    .btn-primary:hover {
        background: #5a67d8;
        transform: translateY(-1px);
    }
    .models-table {
        width: 100%;
        border-collapse: collapse;
    }
    .models-table th, .models-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }
    .models-table th {
        background: #f7fafc;
        font-weight: 600;
    }
    .models-table tr:hover {
        background: #f7fafc;
    }
    button.small {
        background: #e53e3e;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.3s;
    }
    button.small:hover {
        background: #c53030;
    }
    .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #e2e8f0;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info-text {
        font-size: 12px;
        color: #718096;
        margin-top: 10px;
        padding: 10px;
        background: #f7fafc;
        border-radius: 8px;
        line-height: 1.6;
    }
    code {
        background: transparent;
        color: #718096;
        padding: 0;
        border-radius: 0;
        font-family: monospace;
        font-size: 12px;
    }
    a {
        color: #667eea;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
    .symlink-name {
        color: inherit;
        background: transparent;
        font-family: monospace;
        font-size: 13px;
        font-weight: 600;
    }
    .link-del-btn {
        background: #e53e3e;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.3s;
    }
    .link-del-btn:hover {
        background: #c53030;
    }
</style>

<script>
    let localModelsCache = [];
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    async function refreshLocalModels() {
        const modelsDiv = document.getElementById('localModelsList');
        modelsDiv.innerHTML = '<div class="loading"></div> 加载中...';
        
        try {
            const response = await fetch('/api/local/list');
            const data = await response.json();
            
            if (data.success && data.models && data.models.length > 0) {
                localModelsCache = data.models;
                let html = '<table class="models-table">';
                html += '<thead><tr><th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" title="全选/取消全选"></th><th>模型名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>';
                
                const sortedModels = [...data.models].sort((a, b) => a.name.localeCompare(b.name));
                for (const model of sortedModels) {
                    let displayName = model.name;
                    let isPartial = displayName.endsWith('.partial') || displayName.includes('.partial');
                    let sizeClass = isPartial ? 'style="color: #e67e22;"' : '';
                    const encodedName = encodeURIComponent(model.name);
                    html += `
                        <tr>
                            <td><input type="checkbox" class="model-checkbox" value="${encodedName}" onchange="updateSelectedCount()" ${isPartial ? 'disabled' : ''}></td>
                            <td ${sizeClass}>${escapeHtml(displayName)}${isPartial ? ' <span style="color:#e67e22;">(下载中)</span>' : ''}</td>
                            <td>${model.size_str}</td>
                            <td>${model.modified}</td>
                            <td><button class="small" onclick="deleteLocalModel('${escapeHtml(model.name)}')">🗑️ 删除</button></td>
                        </tr>
                    `;
                }
                html += '</tbody></table>';
                modelsDiv.innerHTML = html;
            } else {
                modelsDiv.innerHTML = '<div class="info-text">📭 暂无本地模型，请从「模型下载」页面下载</div>';
            }
        } catch(e) {
            console.error('刷新失败:', e);
            modelsDiv.innerHTML = '<div class="info-text">❌ 加载失败: ' + e.message + '</div>';
        }
    }
    
    async function deleteLocalModel(filename) {
        if (confirm(`确定删除 ${filename}？`)) {
            try {
                const response = await fetch(`/api/local/delete?filename=${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                alert(data.message);
                refreshLocalModels();
                
                // 通知下载页面刷新（如果存在）
                if (window.parent && window.parent.refreshDownloadFileList) {
                    window.parent.refreshDownloadFileList();
                }
            } catch(e) {
                console.error('删除失败:', e);
                alert('删除失败: ' + e.message);
            }
        }
    }

    function toggleSelectAll() {
        const selectAll = document.getElementById('selectAll');
        const checkboxes = document.querySelectorAll('.model-checkbox:not([disabled])');
        checkboxes.forEach(cb => cb.checked = selectAll.checked);
        updateSelectedCount();
    }
    
    function updateSelectedCount() {
        const checked = document.querySelectorAll('.model-checkbox:checked').length;
        const span = document.getElementById('selectedCount');
        if (checked > 0) {
            span.style.display = 'inline';
            span.textContent = `已选 ${checked} 个`;
        } else {
            span.style.display = 'none';
        }
    }
    
    function getSelectedModels() {
        const checkboxes = document.querySelectorAll('.model-checkbox:checked');
        return Array.from(checkboxes).map(cb => decodeURIComponent(cb.value));
    }
    
    async function createSymlinksForSelected() {
        const selected = getSelectedModels();
        if (selected.length === 0) {
            alert('请先选择要创建软链接的模型');
            return;
        }
        
        try {
            const response = await fetch('/api/local/symlinks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model_names: selected})
            });
            const data = await response.json();
            alert(data.message);
            refreshSymlinks();
        } catch(e) {
            console.error('创建软链接失败:', e);
            alert('创建失败: ' + e.message);
        }
    }

    async function refreshSymlinks() {
        const listDiv = document.getElementById('symlinksList');
        listDiv.innerHTML = '<div class="loading"></div> 加载中...';
        
        try {
            const response = await fetch('/api/local/symlinks-list');
            const data = await response.json();
            
            if (data.success && data.symlinks && data.symlinks.length > 0) {
                let html = '<table class="models-table">';
                html += '<thead><tr><th>文件名</th><th>类型</th><th>操作</th></tr></thead><tbody>';
                
                for (const f of data.symlinks) {
                    let typeIcon;
                    if (f.is_dir) {
                        typeIcon = '📁 目录';
                    } else if (f.is_symlink) {
                        typeIcon = '🔗 软链接';
                    } else {
                        typeIcon = '📄 文件';
                    }
                    html += `
                        <tr>
                            <td><span class="symlink-name">${escapeHtml(f.name)}</span></td>
                            <td>${typeIcon}</td>
                            <td><button class="small link-del-btn" onclick="deleteSymlink('${escapeHtml(f.name)}')">🗑️ 删除</button></td>
                        </tr>
                    `;
                }
                html += '</tbody></table>';
                listDiv.innerHTML = html;
            } else if (data.error) {
                listDiv.innerHTML = '<div class="info-text">❌ 加载失败: ' + escapeHtml(data.error) + '</div>';
            } else {
                listDiv.innerHTML = '<div class="info-text">📭 暂无软链接文件，请先下载模型或点击「🔗 创建软链接」</div>';
            }
        } catch(e) {
            console.error('加载软链接列表失败:', e);
            listDiv.innerHTML = '<div class="info-text">❌ 加载失败: ' + e.message + '</div>';
        }
    }
    
    async function createSymlinks() {
        try {
            const response = await fetch('/api/local/symlinks', { method: 'POST' });
            const data = await response.json();
            alert(data.message);
            refreshSymlinks();
        } catch(e) {
            console.error('创建软链接失败:', e);
            alert('创建失败: ' + e.message);
        }
    }

    async function deleteSymlink(filename) {
        if (!confirm(`确定删除 ${filename}？`)) return;
        try {
            const response = await fetch(`/api/local/symlink-delete?filename=${encodeURIComponent(filename)}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            alert(data.message);
            refreshSymlinks();
        } catch(e) {
            console.error('删除软链接失败:', e);
            alert('删除失败: ' + e.message);
        }
    }
    
    // 供下载页面调用的刷新函数
    window.refreshLocalModels = refreshLocalModels;
    
    // 页面加载时刷新
    refreshLocalModels();
    refreshSymlinks();
</script>
